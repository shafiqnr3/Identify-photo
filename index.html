<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Vision | Shafiq Ahmad</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --p: #1a73e8; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .app-card { background: white; width: 100%; max-width: 400px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); padding: 25px; box-sizing: border-box; text-align: center; }
        #preview { width: 100%; border-radius: 15px; display: none; margin-bottom: 15px; border: 1px solid #ddd; }
        .btn { width: 100%; padding: 16px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.3s; margin-top: 10px; }
        .btn-cam { background: var(--p); color: white; }
        #status { margin: 15px 0; color: #555; font-size: 14px; font-weight: 500; }
        #resultBox { background: #e8f0fe; padding: 15px; border-radius: 12px; display: none; text-align: left; position: relative; border-left: 5px solid var(--p); }
        .speaker { position: absolute; right: 10px; top: 10px; font-size: 24px; color: var(--p); cursor: pointer; }
    </style>
</head>
<body>

<div class="app-card">
    <h2 style="color:var(--p); margin:0;">AI Vision Pro</h2>
    <p style="font-size:12px; color:#888; margin-bottom:20px;">Developed by Shafiq Ahmad</p>

    <img id="preview" src="">
    <div id="status">Select a photo to start...</div>

    <button class="btn btn-cam" onclick="document.getElementById('fileInp').click()">
        <i class="fas fa-camera"></i> Camera / Gallery
    </button>
    <input type="file" id="fileInp" accept="image/*" style="display:none">

    <div id="resultBox">
        <i class="fas fa-volume-up speaker" onclick="speakText()"></i>
        <strong style="color:var(--p)">AI Analysis:</strong>
        <p id="resText" style="margin-top:10px; line-height:1.6; color:#333;"></p>
    </div>
</div>

<script>
    const KEY = "AIzaSyBUANQdo6wRKn9Q-rPher8KAprtc9nOWlk";
    const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${KEY}`;

    const fileInp = document.getElementById('fileInp');
    const preview = document.getElementById('preview');
    const status = document.getElementById('status');
    const resText = document.getElementById('resText');
    const resultBox = document.getElementById('resultBox');

    fileInp.onchange = (e) => {
        const file = e.target.files[0];
        if(!file) return;

        const reader = new FileReader();
        reader.onload = () => {
            preview.src = reader.result;
            preview.style.display = "block";
            status.innerHTML = "AI Analyzing... <i class='fas fa-spinner fa-spin'></i>";
            
            const base64 = reader.result.split(',')[1];
            callAI(base64);
        };
        reader.readAsDataURL(file);
    };

    async function callAI(base64) {
        try {
            const response = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [
                        { text: "Is photo ko pehchanein aur iska naam aur 2 bade uses Hindi mein batayein." },
                        { inline_data: { mime_type: "image/jpeg", data: base64 } }
                    ]}]
                })
            });

            const data = await response.json();
            
            if(data.candidates && data.candidates.length > 0) {
                resText.innerText = data.candidates[0].content.parts[0].text;
                status.innerText = "Mubarak ho! Analysis Complete.";
                resultBox.style.display = "block";
            } else {
                status.innerHTML = "<b style='color:red'>Google Error: " + (data.error ? data.error.message : "Try again") + "</b>";
            }
        } catch (err) {
            status.innerHTML = "<b style='color:red'>Network Error! Check Internet Connection.</b>";
        }
    }

    function speakText() {
        const msg = new SpeechSynthesisUtterance(resText.innerText);
        msg.lang = 'hi-IN';
        window.speechSynthesis.speak(msg);
    }
</script>

</body>
</html>
