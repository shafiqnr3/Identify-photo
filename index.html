<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Vision | Shafiq Ahmad</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        #preview { width: 100%; border-radius: 15px; display: none; margin-bottom: 15px; }
        .btn { background: #ff9d00; color: white; padding: 15px; border: none; border-radius: 12px; width: 100%; font-weight: bold; cursor: pointer; }
        #status { margin: 15px 0; font-size: 14px; color: #666; }
        #resBox { background: #fff9e6; padding: 15px; border-radius: 12px; display: none; text-align: left; border-left: 5px solid #ff9d00; }
    </style>
</head>
<body>

<div class="card">
    <h2>AI Vision Pro</h2>
    <p style="font-size:11px; color:#888;">Stable Version - Shafiq Ahmad</p>
    <img id="preview">
    <div id="status">Photo select karein...</div>
    <button class="btn" onclick="document.getElementById('f').click()">Camera / Gallery</button>
    <input type="file" id="f" accept="image/*" style="display:none">
    <div id="resBox"><strong>AI Result:</strong><p id="t"></p></div>
</div>

<script>
    const TOKEN = "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";
    // Is bar hum seedha binary data bhej rahe hain bina extra complexity ke
    const API_URL = "https://api-inference.huggingface.co/models/Salesforce/blip-image-captioning-large";

    document.getElementById('f').onchange = async (e) => {
        const file = e.target.files[0];
        if(!file) return;

        document.getElementById('preview').src = URL.createObjectURL(file);
        document.getElementById('preview').style.display = "block";
        document.getElementById('status').innerText = "AI is scanning...";

        try {
            const response = await fetch(API_URL, {
                headers: { 
                    "Authorization": `Bearer ${TOKEN}`,
                    "Content-Type": "application/octet-stream" 
                },
                method: "POST",
                body: file,
            });

            const result = await response.json();

            if (Array.isArray(result) && result[0].generated_text) {
                document.getElementById('t').innerText = result[0].generated_text;
                document.getElementById('resBox').style.display = "block";
                document.getElementById('status').innerText = "Success!";
            } else if (result.error && result.estimated_time) {
                document.getElementById('status').innerText = "Model loading... Try in 20 seconds.";
            } else {
                document.getElementById('status').innerText = "Technical Detail: " + JSON.stringify(result);
            }
        } catch (err) {
            // Agar browser block kare toh humein ye dikhega
            document.getElementById('status').innerText = "Security Block! Chrome Incognito mein try karein.";
            console.log(err);
        }
    };
</script>
</body>
</html>
